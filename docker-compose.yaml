services:
  mysql-db:
    image: mysql:9.7
    container_name: entropy_users_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: secretpassword
      MYSQL_DATABASE: entropy_users_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  entropy-backend-ms-users:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: entropy_backend_ms_users
    depends_on:
      - mysql-db
    ports:
      - "3001:3001"
    volumes:
      - .:/app

volumes:
  mysql_data: